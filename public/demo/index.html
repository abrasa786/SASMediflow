<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mediflow Trail</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#eef1f8; --line:#dde2ee; --fg:#0f172a; --muted:#5b6478;
  --accent:#2563eb; --accent2:#7c3aed; --accent-soft:#e6eeff; --accent-fg:#ffffff;
  --ok:#0f9f6e; --ok-soft:#dcf5ea; --warn:#b7791f; --warn-soft:#fdf0d5; --bad:#d6364a; --bad-soft:#fde4e8;
  --doc1:#2563eb; --doc1-soft:#dbe7ff; --doc2:#c2410c; --doc2-soft:#ffe6d6;
  --wa:#1fa855; --wa-bg:#e7f7ee; --wa-bubble:#d9fdd3; --wa-chat:#efeae2; --hatch:#e3e7f1;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#131a2e; --surface2:#1a2340; --line:#27324f; --fg:#e8ecf7; --muted:#9aa5c0;
  --accent:#6d9bff; --accent2:#a78bfa; --accent-soft:#1c2a52; --accent-fg:#0b1020;
  --ok:#3ddc97; --ok-soft:#10382b; --warn:#f2b84b; --warn-soft:#3b2d0f; --bad:#ff6b81; --bad-soft:#40161f;
  --doc1:#7aa5ff; --doc1-soft:#1b2c57; --doc2:#ff9f66; --doc2-soft:#47260f;
  --wa:#3ddc97; --wa-bg:#10382b; --wa-bubble:#0f3d2e; --wa-chat:#0d1a17; --hatch:#222c49; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#131a2e; --surface2:#1a2340; --line:#27324f; --fg:#e8ecf7; --muted:#9aa5c0;
  --accent:#6d9bff; --accent2:#a78bfa; --accent-soft:#1c2a52; --accent-fg:#0b1020;
  --ok:#3ddc97; --ok-soft:#10382b; --warn:#f2b84b; --warn-soft:#3b2d0f; --bad:#ff6b81; --bad-soft:#40161f;
  --doc1:#7aa5ff; --doc1-soft:#1b2c57; --doc2:#ff9f66; --doc2-soft:#47260f;
  --wa:#3ddc97; --wa-bg:#10382b; --wa-bubble:#0f3d2e; --wa-chat:#0d1a17; --hatch:#222c49; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-inline:16px;padding-block:16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:1320px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800}
.top-r{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.pill.btn:hover{border-color:var(--accent);color:var(--accent)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:1fr}}

/* narrator */
.rail{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);position:sticky;top:12px;overflow-x:hidden;overflow-y:auto;max-height:calc(100vh - 24px);min-width:0}
@media(max-width:980px){.rail{position:static;max-height:none}}
.chapters{display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
@media(max-width:980px){.chapters{flex-direction:row;overflow-x:auto;overflow-y:hidden}}
.chap{display:flex;gap:10px;align-items:center;padding:9px 14px;border:0;background:transparent;text-align:left;border-left:3px solid transparent;color:var(--muted);white-space:nowrap}
.chap .n{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.chap.done .n{background:var(--ok-soft);color:var(--ok)}
.chap.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}
.chap.on .n{background:var(--accent);color:var(--accent-fg)}
@media(max-width:980px){.chap{border-left:0;border-bottom:3px solid transparent}.chap.on{border-bottom-color:var(--accent)}}
.say{padding:16px 16px 6px}
.aria{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.aria .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;display:grid;place-items:center;font-size:13px}
.aria b{font-size:13px}.aria span{font-size:12px;color:var(--muted)}
.say h2{font-size:18px;line-height:1.3;margin-bottom:8px;text-wrap:balance}
.say .txt{color:var(--fg);font-size:14px}
.say .txt p+p{margin-top:8px}
.how{margin:12px 16px 0;border:1px dashed var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.how b{color:var(--fg);display:block;margin-bottom:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.how code{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:11.5px;color:var(--fg)}
.ctl{display:flex;align-items:center;gap:8px;padding:14px 16px 16px}
.ctl .grow{flex:1;height:5px;background:var(--surface2);border-radius:9px;overflow:hidden}
.ctl .grow i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg);border:0}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ok{background:var(--ok);color:#fff;border:0}
.btn.danger{color:var(--bad)}

/* app frame */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.url{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:600px}
@media(max-width:720px){.app{grid-template-columns:1fr}}
.side{background:var(--surface2);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
@media(max-width:720px){.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}}
.side .cl{padding:4px 8px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.side .cl small{display:block;font-weight:400;color:var(--muted);font-size:11px}
@media(max-width:720px){.side .cl{display:none}}
.nav{padding:7px 10px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
button.nav{border:0;background:transparent;text-align:left;font:inherit;width:100%}
button.nav:hover{background:var(--surface)}
.nav.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav.new{animation:pop .5s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.main{padding:18px;min-width:0}
.main h3.pg{font-size:19px;margin-bottom:2px}
.main .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);min-width:0}
.card.hl{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .f{margin-top:8px;font-size:12px;background:var(--accent-soft);border-radius:8px;padding:6px 8px;color:var(--fg);font-variant-numeric:tabular-nums;animation:pop .35s}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted);min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px}
.bars .b.today i{outline:2px solid var(--accent);outline-offset:1px}
.bars .b em{font-style:normal;color:var(--fg);font-size:11px;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.mono{font-variant-numeric:tabular-nums}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-width:0}
.chatscroll{max-height:430px;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13.5px;animation:pop .3s;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.msg .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font-size:12px}
.chip:hover{border-color:var(--accent)}.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip small{color:var(--muted);margin-left:4px}.chip.sel small{color:inherit;opacity:.8}
.composer{display:flex;gap:8px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;background:var(--surface);align-items:center}
.composer span{flex:1;color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* checklist of behind the scenes */
.trace{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.trace li{display:flex;gap:8px;align-items:flex-start;animation:pop .3s}
.trace li i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-style:normal;font-size:11px;margin-top:1px}
.trace li.no i{background:var(--bad-soft);color:var(--bad)}
.trace li.go i{background:var(--accent-soft);color:var(--accent)}
.trace small{display:block;color:var(--muted);font-size:12px}

/* phone */
.phone{width:min(100%,290px);margin:0 auto;border:8px solid #111827;border-radius:30px;overflow:hidden;background:var(--wa-chat);box-shadow:var(--shadow)}
.phone .ph{background:#0b6b4f;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:13px}
.phone .ph .av{width:26px;height:26px;border-radius:50%;background:#fff;color:#0b6b4f;display:grid;place-items:center;font-weight:800;font-size:12px}
.phone .ph small{display:block;font-size:10px;opacity:.8}
.phone .pb{padding:10px;min-height:250px;display:flex;flex-direction:column;gap:6px;color:#111}
.phone .wb{background:var(--wa-bubble);color:#111;border-radius:10px 10px 10px 2px;padding:7px 9px;font-size:12px;line-height:1.4;max-width:94%;white-space:pre-wrap;animation:pop .35s;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.phone .wb.me{align-self:flex-end;background:#fff;border-radius:10px 10px 2px 10px}
.phone .wb time{display:block;text-align:right;font-size:10px;color:#667781;margin-top:2px}
:root[data-theme="dark"] .phone .wb{color:#e8ecf7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .phone .wb{color:#e8ecf7}}
:root[data-theme="dark"] .phone .wb.me{background:#202c33}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .phone .wb.me{background:#202c33}}

/* calendar */
.cal{display:grid;grid-template-columns:54px repeat(2,minmax(120px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12px;min-width:360px}
.cal .hd{padding:8px;background:var(--surface2);font-weight:600;border-bottom:1px solid var(--line);text-align:center}
.cal .tm{color:var(--muted);text-align:right;padding:0 6px;height:34px;border-bottom:1px solid var(--line);font-size:11px;line-height:34px;background:var(--surface2)}
.cal .col{position:relative;border-left:1px solid var(--line)}
.cal .cell{height:34px;border-bottom:1px solid var(--line)}
.cal .ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 7px;font-size:11.5px;overflow:hidden;border-left:4px solid;line-height:1.25;animation:pop .35s}
.cal .ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.d1{background:var(--doc1-soft);border-color:var(--doc1)}.cal .ev.d2{background:var(--doc2-soft);border-color:var(--doc2)}
.cal .ev.completed{opacity:.6}
.cal .ev.new{box-shadow:0 0 0 2px var(--ok)}
.cal .ev.sit{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(124,58,237,.12) 6px 12px)}
.cal .brk{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);display:grid;place-items:center;color:var(--muted);font-size:11px}
.cal .off{position:absolute;inset:0;background:var(--hatch);display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:600;padding:10px}
.cal .past{position:absolute;left:0;right:0;top:0;background:color-mix(in srgb,var(--surface) 70%,transparent);border-bottom:2px solid var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs .btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
select,input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
label.lb{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.field{min-width:0}
.sit{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sit .no{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700}
.sit.done .no{background:var(--ok);color:#fff}.sit.next .no{background:var(--accent);color:#fff}
.sit .meta{font-size:12px;color:var(--muted)}
.prog{height:8px;background:var(--surface2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;transition:width .4s}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.calc .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.calc .r{text-align:right}
.note{font-size:12px;color:var(--muted)}
.callout{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--accent-soft)}
.callout.ok{background:var(--ok-soft)}.callout.warn{background:var(--warn-soft)}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.spec{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left}
.spec .e{font-size:22px}.spec b{display:block;margin-top:4px}.spec small{color:var(--muted);font-size:12px}
.spec.on{border-color:var(--accent);background:var(--accent-soft)}
.form .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
@media(max-width:640px){.form .row{grid-template-columns:1fr}}
.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-height:36px}
.inp.fill{border-color:var(--accent)}
.inp.empty{color:var(--muted)}
.cb{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.cb i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--accent-fg);flex:none}
.cb.on i{background:var(--accent);border-color:var(--accent)}
.cb em{font-style:normal;color:var(--muted);font-size:12px;margin-left:auto}
pre.json{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11.5px;overflow-x:auto;color:var(--fg)}
.sw{display:flex;gap:10px;align-items:center;font-size:13px}
.sw .t{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on .t{background:var(--ok)}.sw.on .t::after{left:18px}
.end{text-align:center;padding:30px 10px}
.end h3{font-size:22px;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.intro{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.intro[hidden]{display:none}
.intro .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);max-width:460px;width:100%;padding:26px;text-align:center}
.intro h1{font-size:22px;margin:12px 0 8px;text-wrap:balance}
.intro p{color:var(--muted);margin-bottom:18px}
.intro .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.speaking{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-left:6px;vertical-align:middle}
.speaking i{width:3px;background:var(--accent);border-radius:2px;animation:eq .8s infinite ease-in-out}
.speaking i:nth-child(2){animation-delay:.15s}.speaking i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* trail */
.trailbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trailbar .pts{font-weight:700;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:4px;flex:1;min-width:0;flex-wrap:wrap}
.bdg{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--warn-soft);border:1px solid var(--warn);animation:pop .5s}
.modes{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mode{border:0;background:transparent;padding:4px 10px;font-size:12px;color:var(--muted)}
.mode.on{background:var(--accent);color:var(--accent-fg);font-weight:600}

<script>
(function(){
"use strict";
/* ───────────── tiny helpers ───────────── */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const wd=s=>parseD(s).getDay();
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nice=s=>{const d=parseD(s);return DN[d.getDay()]+" "+d.getDate()+" "+MN[d.getMonth()]};
const fmt=m=>{let h=Math.floor(m/60);const mi=m%60,p=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(mi)+" "+p};
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;

/* ───────────── demo calendar ───────────── */
const base=new Date(); if(base.getDay()===6)base.setDate(base.getDate()+2); else if(base.getDay()===0)base.setDate(base.getDate()+1);
const D0=iso(base); let D1=addD(D0,1); if(wd(D1)===0)D1=addD(D1,1);
const NOW=10*60+30, DUR=30, FEE={priya:800,arjun:1200}; // the demo clock is frozen at 10:30 AM

/* ───────────── domain: doctors, rules, slots ───────────── */
const DOCS=[
  {id:"priya",name:"Dr. Priya Sharma",short:"Dr. Sharma",role:"Orthodontist",cls:"d1",hours:{1:[540,1020],2:[540,1020],3:[540,1020],4:[540,1020],5:[540,1020],6:[540,780]},brk:[780,840]},
  {id:"arjun",name:"Dr. Arjun Mehta",short:"Dr. Mehta",role:"Endodontist",cls:"d2",hours:{1:[600,1080],2:[600,1080],3:[600,1080],4:[600,1080],5:[600,1080],6:[600,840]},brk:[810,870]}
];
const docById=id=>DOCS.find(d=>d.id===id);
const ORDER=[...DOCS].sort((a,b)=>a.name.localeCompare(b.name)); // "first free doctor" order

let S; // all mutable demo state
function seed(){
  S={
    leaves:new Set(),
    patients:[
      {id:"p1",name:"Rahul Gupta",phone:"98100 11111",usual:"priya"},
      {id:"p2",name:"Anita Sharma",phone:"98100 22222",usual:"arjun"},
      {id:"p3",name:"Kiran Patel",phone:"98100 33333",usual:"priya"},
      {id:"p4",name:"Deepa Nair",phone:"98100 44444",usual:"arjun"},
      {id:"p5",name:"Mohammed Farhan",phone:"98100 55555",usual:"priya"}
    ],
    appts:[],nid:1,
    stock:[
      {n:"Anaesthetic cartridges",q:120,min:40,u:"pcs"},{n:"Gloves (M)",q:48,min:50,u:"pairs"},
      {n:"Endo files (K-file)",q:30,min:12,u:"pcs"},{n:"Gutta-percha points",q:64,min:25,u:"pcs"},
      {n:"Implant fixtures",q:6,min:3,u:"pcs"},{n:"Composite A2",q:14,min:6,u:"syringes"}
    ],
    plan:null, bld:{applied:false,fresh:false}
  };
  const A=(date,start,doc,pid,reason,fee,st)=>S.appts.push({id:"a"+S.nid++,date,start,dur:DUR,doc,pid,reason,fee,status:st||"confirmed"});
  A(D0,540,"priya","p1","Braces tightening",800,"completed");
  A(D0,570,"priya","p3","Extraction consult",600,"completed");
  A(D0,660,"priya","p5","Crown fitting",800);
  A(D0,600,"arjun","p2","RCT follow-up",1200,"completed");
  A(D0,630,"arjun","p4","Cleaning",500);
  A(D0,720,"arjun","p3","Filling",700);
  A(D1,570,"priya","p5","Review",800);
  A(D1,660,"priya","p4","Whitening",1500);
  A(D1,600,"arjun","p3","Root canal",1200);
  A(D1,720,"arjun","p2","Crown prep",1200);
}
const patient=id=>S.patients.find(p=>p.id===id);
const apptsOn=d=>S.appts.filter(a=>a.date===d).sort((a,b)=>a.start-b.start);

/* the same rules the real engine enforces (appt_check_slot) */
function checkSlot(doc,date,start,dur){
  dur=dur||DUR;
  if(wd(date)===0)return"clinic_closed";
  if(S.leaves.has(doc.id+"|"+date))return"on_leave";
  const h=doc.hours[wd(date)];
  if(!h||start<h[0]||start+dur>h[1])return"outside_hours";
  if(start<doc.brk[1]&&start+dur>doc.brk[0])return"break";
  if(date===D0&&start<NOW)return"past";
  if(S.appts.some(a=>a.doc===doc.id&&a.date===date&&a.status!=="cancelled"&&start<a.start+a.dur&&start+dur>a.start))return"booked";
  return null;
}
const WHY={clinic_closed:"clinic is closed",on_leave:"is on leave",outside_hours:"is outside working hours",break:"is on a break",past:"time has passed",booked:"is already booked"};
function slotsFor(doc,date){const h=doc.hours[wd(date)];if(!h)return[];const out=[];for(let s=h[0];s+DUR<=h[1];s+=DUR)out.push(s);return out}
function freeSlots(date,docId){
  const out=[];
  (docId?[docById(docId)]:ORDER).forEach(d=>slotsFor(d,date).forEach(s=>{if(!checkSlot(d,date,s))out.push({doc:d,start:s})}));
  return out.sort((a,b)=>a.start-b.start);
}
/* doctor assignment: usual doctor first, otherwise first free doctor */
function resolveDoctor(pid,date,start){
  const trace=[],p=patient(pid);
  if(p&&p.usual){
    const u=docById(p.usual),why=checkSlot(u,date,start);
    if(!why){trace.push({ok:1,t:u.name+" is "+p.name.split(" ")[0]+"'s usual doctor and is free at "+fmt(start)});return{doc:u,how:"auto_usual",trace}}
    trace.push({no:1,t:u.name+" is the usual doctor but "+WHY[why]+" at "+fmt(start)});
  }else trace.push({go:1,t:"New patient — no usual doctor yet"});
  for(const d of ORDER){
    if(p&&d.id===p.usual)continue;
    const why=checkSlot(d,date,start);
    if(!why){trace.push({ok:1,t:d.name+" is the first free doctor at "+fmt(start)});return{doc:d,how:"auto_free",trace}}
    trace.push({no:1,t:d.name+" "+WHY[why]});
  }
  trace.push({no:1,t:"Nobody is free at "+fmt(start)});
  return{doc:null,how:null,trace};
}
function book(o){const a=Object.assign({id:"a"+S.nid++,dur:DUR,status:"confirmed"},o);S.appts.push(a);return a}
function unbook(tag){S.appts=S.appts.filter(a=>a.tag!==tag)}

/* ───────────── dashboard maths (computed from state, never hard-coded) ───────────── */
function planMoney(pl){
  if(!pl)return{sub:0,disc:0,net:0,paid:0,bal:0,billed:0};
  const sub=pl.sit.reduce((s,x)=>s+x.amt,0),disc=Math.round(sub*pl.disc/100),net=sub-disc,f=sub?net/sub:1;
  const paid=pl.sit.reduce((s,x)=>s+x.paid,0),billed=pl.sit.filter(x=>x.status==="done").reduce((s,x)=>s+Math.round(x.amt*f),0);
  return{sub,disc,net,paid,bal:net-paid,billed,f};
}
function kpis(){
  const a=apptsOn(D0).filter(x=>x.status!=="cancelled");
  const done=a.filter(x=>x.status==="completed"), left=a.length-done.length;
  const pm=planMoney(S.plan);
  const billedA=a.reduce((s,x)=>s+(x.kind==="sitting"?0:x.fee),0), paidA=done.reduce((s,x)=>s+(x.kind==="sitting"?0:x.fee),0);
  const billed=billedA+pm.billed, collected=paidA+pm.paid;
  let avail=0;DOCS.forEach(d=>{const h=d.hours[wd(D0)];if(h)avail+=(h[1]-h[0])-(d.brk[1]-d.brk[0])});
  const booked=a.reduce((s,x)=>s+x.dur,0);
  const newPts=18+S.patients.filter(p=>p.created).length;
  const outstanding=18500+pm.bal;
  const low=S.stock.filter(s=>s.q<=s.min);
  return{a,done,left,billed,collected,avail,booked,newPts,outstanding,low,pm,
    rate:pct(collected,billed),util:pct(booked,avail),ns:{c:112,n:9,rate:pct(9,121)}};
}
/* ───────────── shared UI pieces ───────────── */
const q=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const CLINIC=()=>(UI.su.clinic||"").trim()||"Bright Smile Dental";
const taskIs=id=>{const st=CH[pos.c]&&CH[pos.c].steps[pos.s];return !!(st&&st.task&&st.task.id===id)};
const NAV=[["dash","🏠","Dashboard"],["chat","🤖","Assistant"],["cal","🗓","Calendar"],["treat","🦷","Treatments"],["wa","💬","WhatsApp"],["bld","🛠","AI Builder"]];
const GOTO={dash:"dash",chat:"chat",cal:"cal",treat:"treat",wa:"wa",bld:"bld",al:"bld"};
function shell(active,inner,url){
  const items=NAV.slice(); if(S.bld.applied)items.splice(items.length-1,0,["al","📎","Aligners"]);
  $("#url").textContent="app.mediflow.in/"+url;
  return '<div class="app"><div class="side"><div class="cl">'+q(CLINIC())+'<small>Dental pack · '+q(UI.su.city||"Bengaluru")+'</small></div>'+
    items.map(i=>'<button class="nav'+(i[0]===active?" on":"")+(i[0]==="al"&&S.bld.fresh?" new":"")+'" data-act="goto" data-ch="'+GOTO[i[0]]+'">'+i[1]+" "+i[2]+"</button>").join("")+
    '<span class="nav" style="opacity:.5">👥 Patients</span><span class="nav" style="opacity:.5">🧾 Billing</span><span class="nav" style="opacity:.5">📦 Stock</span></div><div class="main">'+inner+"</div></div>";
}
const first=n=>n.split(" ")[0];
function chat(msgs){
  return '<div class="chatscroll"><div class="chat">'+msgs.map(m=>'<div class="msg '+m.w+'">'+m.h+(m.chips?'<div class="chips">'+m.chips+"</div>":"")+"</div>").join("")+"</div></div>";
}
function phone(name,num,bubbles){
  return '<div class="phone"><div class="ph"><span class="av">'+name[0]+'</span><div>'+name+"<small>"+num+'</small></div></div><div class="pb">'+
    bubbles.map(b=>'<div class="wb'+(b.me?" me":"")+'">'+b.t.replace(/\*([^*]+)\*/g,"<b>$1</b>")+"<time>"+(b.time||"10:31 AM")+(b.me?" ✓✓":"")+"</time></div>").join("")+"</div></div>";
}
const trace=items=>'<ul class="trace">'+items.map(i=>'<li class="'+(i.no?"no":i.go?"go":"")+'"><i>'+(i.no?"✕":i.go?"→":"✓")+"</i><div>"+i.t+(i.s?"<small>"+i.s+"</small>":"")+"</div></li>").join("")+"</ul>";
const cb=(on,t,em,act)=>(act?'<button class="cb':'<div class="cb')+(on?" on":"")+'"'+(act?' data-act="rec" data-v="'+act+'"':"")+'><i>'+(on?"✓":"")+"</i>"+t+(em?"<em>"+em+"</em>":"")+(act?"</button>":"</div>");

function waText(kind,a,extra){
  const p=patient(a.pid)||{name:"Patient"},d=docById(a.doc),when=nice(a.date)+" at "+fmt(a.start),f=first(p.name);
  const foot="\nFor any change please call +91 80 4000 1234.";
  switch(kind){
    case"confirm":return "✅ *Appointment confirmed*\n\nHi "+f+", your appointment at *"+CLINIC()+"* is booked.\n\n📅 "+when+"\n👨‍⚕️ "+d.name+"\n🏥 In-clinic visit\n💰 Fee: "+inr(a.fee)+"\n📍 MG Road, Bengaluru\n\nPlease arrive 10 minutes early."+foot;
    case"remind":return "⏰ *Appointment reminder*\n\nHi "+f+", this is a reminder of your appointment at *"+CLINIC()+"*.\n\n📅 "+when+"\n👨‍⚕️ "+d.name+"\n\nReply CANCEL if you cannot make it."+foot;
    case"resched":return "🔁 *Appointment rescheduled*\n\nHi "+f+", your appointment has moved.\n\n❌ Was: "+extra+"\n✅ Now: "+when+"\n👨‍⚕️ "+d.name+foot;
    case"cancel":return "❌ *Appointment cancelled*\n\nHi "+f+", your appointment on "+when+" has been cancelled.\nReason: "+(extra||"Doctor unavailable")+"\n\nReply here to book a new time."+foot;
    case"sitting":return "🦷 *Next sitting reminder*\n\nHi "+f+", sitting "+extra+" of your treatment is on\n📅 "+when+"\n👨‍⚕️ "+d.name+"\n\nPlease eat before you come. See you soon!"+foot;
    case"receipt":return "🧾 *Payment received*\n\nHi "+f+", we received "+inr(extra.paid)+" for "+extra.title+".\nBalance remaining: "+inr(extra.bal)+"\nInvoice "+extra.inv+" attached."+foot;
    case"doctor":return "📋 *New appointment*\n\n"+p.name+(p.created?" · new patient":"")+"\n📅 "+when+"\n🏥 In-clinic"+(a.reason?"\n📝 "+a.reason:"");
  }
}

/* ───────────── 1 · sign-up & log-in ───────────── */
function pwScore(p){return (p.length>=8)+(p.length>=12)+/[A-Z]/.test(p)+/[0-9]/.test(p)+/[^A-Za-z0-9]/.test(p)}
function pwMeter(p){const n=pwScore(p),L=["Too short","Weak","Okay","Good","Strong","Excellent"][n];return '<div style="display:flex;gap:4px;align-items:center;margin-top:6px">'+[1,2,3,4,5].map(i=>'<i style="flex:1;height:5px;border-radius:9px;background:'+(i<=n?(n<3?"var(--warn)":"var(--ok)"):"var(--line)")+'"></i>').join("")+'<small class="note" style="min-width:64px;text-align:right">'+L+"</small></div>"}
function suValid(stage){
  const U=UI.su;
  if(stage==="clinic")return U.clinic.trim().length<3?"Give your clinic a name (at least 3 letters).":!U.city.trim()?"Add the city.":"";

  const priv='<div class="card">'+chat([{w:"u",h:"What is Kohli’s score today?"},{w:"a",h:botN()+" here, "+q(CLINIC())+"’s assistant. I can only help with running your clinic: appointments, patients, billing, stock, staff and reports. That question is outside what I do."}])+'</div><div class="card"><b>Settings → AI &amp; privacy</b><p class="note" style="margin-top:6px">What you type stays in your own database. External AI is <b>off</b> by default; when on, names and numbers are masked first. See the history, delete one chat or all of it, and set how long it is kept.</p></div>';
  const brand='<div class="card"><b>Settings → Branding</b><div class="form" style="margin-top:8px"><div class="row"><div><label class="lb">Logo</label><input class="inp" readonly value="brightsmile-logo.png"></div><div><label class="lb">Colour</label><input class="inp" readonly value="#0e7490"></div></div><div class="row"><div><label class="lb">Web address</label><input class="inp" readonly value="mediflow.in/c/'+q(UI.su.slug||"bright-smile")+'"></div><div><label class="lb">Own domain</label><input class="inp" readonly value="app.brightsmile.in  (verify with one DNS record)"></div></div><div class="row"><div><label class="lb">AI assistant name</label><input class="inp" readonly value="'+botN()+'"></div><div></div></div></div></div>';
  const T=[pane("Billing",inv),pane("Stock and purchasing",stock),pane("Attendance and leave",att),pane("Users",usr),pane("Your assistant stays in its lane",priv),pane("Branding",brand)];
  return shell("",T[s],["billing","purchasing","attendance","users","settings","settings"][s])
}
function scrAgent(s){
  const dash='<div class="card"><b>Daily ops</b> <span class="tag ok">saved</span><div class="grid" style="margin-top:8px"><div class="card"><b>Appointments by doctor</b><p class="note">Dr. Sharma 6 · Dr. Mehta 4 · Dr. Rao 3</p></div><div class="card"><b>Unpaid invoices by month</b><p class="note">Sep ₹6,400 · Oct ₹21,000</p></div></div></div>';
  const T=[
   ['Calendar by chat',chat([{w:"u",h:"What’s on tomorrow for Dr Mehta?"},{w:"a",h:"Dr. Mehta’s schedule for tomorrow<br>• 10:00 AM · Rahul Gupta<br>• 11:30 AM · Meera Iyer<br>• 4:00 PM · Anita Rao"},{w:"u",h:"Mark Dr Mehta on leave 25 to 27 Oct"},{w:"a",h:"Mark Dr. Mehta on leave 25 Oct to 27 Oct? Nobody will be able to book him then.<br>⚠️ 2 confirmed appointments fall in that period. They stay booked until you move them.<br>Reply yes to confirm."},{w:"u",h:"yes"},{w:"a",h:"Done. Dr. Mehta is on leave and can’t be booked then."}])],
   ['Records by chat',chat([{w:"u",h:"Add aligner tray patient Rahul, status In production, due 4 Nov"},{w:"a",h:"Add this aligner tray: Patient: Rahul Gupta, Status: In production, Due: 2026-11-04<br>Reply yes to save."},{w:"u",h:"yes"},{w:"a",h:"Saved. The aligner tray is added."},{w:"u",h:"Update aligner tray Rahul set status to Delivered"},{w:"a",h:"Update Rahul Gupta: Status: Delivered. Reply yes to save."}])+'<p class="note">Saved as the signed-in person, so the same access rules apply as in the app. A flow can react to the save.</p>'],
   ['Dashboards by chat',chat([{w:"u",h:"Create a dashboard called Daily ops with appointments by doctor and unpaid invoices by month"},{w:"a",h:"Create 2 reports and the “Daily Ops” dashboard that shows them.<br>• Report “Appointments by doctor” (bar)<br>• Report “Unpaid invoices by month”<br>• Dashboard “Daily Ops”<br>Reply yes to save."},{w:"u",h:"yes"},{w:"a",h:"Done. The dashboard and its reports are saved. Everyone with access to that data can open it."}])+dash],
   ['The Builder adds flows',chat([{w:"u",h:"When an appointment is booked, send the patient a WhatsApp confirmation"},{w:"a",h:"Plan: new flow “Appointment booked → WhatsApp patient (confirmation)”. Approve to turn it on. You can undo it."},{w:"u",h:"Every day remind patients a day before their appointment"},{w:"a",h:"Plan: new flow “Day before appointment → WhatsApp patient (reminder)”. Runs once a day."}])+'<p class="note">Flows send through the WhatsApp Cloud API when connected, otherwise they prepare a one-tap link. Builder → Automation flows shows what ran.</p>'],
   ['Apps and who sees them','<div class="grid"><div class="card"><b>📅 Booking</b><p class="note" style="margin-top:6px">Home · Patients · Appointments · Calendar · Availability · Recall</p></div><div class="card"><b>🧾 Payments</b><p class="note" style="margin-top:6px">Home · Invoices · Pending payments · Payment history</p></div><div class="card"><b>💊 Inventory</b><p class="note" style="margin-top:6px">Home · Stock · Purchase orders · Distributors · Supplier bills</p></div><div class="card"><b>🔐 Administration</b><p class="note" style="margin-top:6px">Home · Users · Staff · Permissions · Attendance · Leave · Settings</p></div></div><p class="note">Pick an app from the launcher at the top of the left menu to see only its tabs. Each app has a Home screen with its numbers and dashboard. Admins choose who sees each app and tab in <b>App Manager</b>, and the Builder asks who should see every new app.</p>'],
   ['WhatsApp chat and recall',phone("Anita Rao","WhatsApp",[{t:"Hi Anita, this is "+q(CLINIC())+": your treatment (Root canal) is still in progress and your next visit isn’t booked yet. Reply *book* and I’ll find you a time."},{me:1,t:"book"},{t:"Which day would you like? For example “tomorrow”, “Friday” or “25 Oct”."},{me:1,t:"Friday"},{t:"Free times:\n1. Fri 23 Oct, 10:00 AM · Dr. Sharma\n2. Fri 23 Oct, 11:30 AM · Dr. Sharma"},{me:1,t:"2"},{t:"✅ Booked for Fri 23 Oct at 11:30 AM with Dr. Sharma."}])+'<p class="note">Patients can also say <b>my appointments</b>, <b>reschedule</b>, <b>cancel</b> or <b>balance</b>, and <b>stop</b> to opt out. They only ever see their own records. The Recall screen lists who is due and can send daily on its own.</p>'],
  ['Who does what','<div class="grid"><div class="card"><b>🤖 The assistant · everyone, within their role</b><ul style="margin:8px 0 0 16px"><li>Calendar: agenda, free times, leave, hours, book, cancel, move, mark done</li><li>Records: add, update, list</li><li>Reports and dashboards: ask, create, save</li></ul></div><div class="card"><b>🛠 The AI Builder · admin</b><ul style="margin:8px 0 0 16px"><li>New apps, tables, fields, tabs</li><li>Automation flows</li><li>Booking rules, permission sets</li><li>Approve, then undo any time</li></ul></div></div><p class="note">Anything outside the clinic gets a polite refusal from both.</p>']
  ];
  return shell(s===3?"bld":s===4?"":"chat",'<h3 class="pg">'+T[s][0]+'</h3>'+T[s][1],["chatbot","chatbot","chatbot","builder","apps","whatsapp","chatbot"][s])
}

const CH0=[
 {id:"signup",title:"Sign up & pick a specialty",url:"mediflow.in/signup",screen:scrSignup,steps:[
  {t:"Start with your clinic",say:"<p>Every clinic starts the same way: about a minute of sign-up. First the basics: clinic name, city and phone.</p><p>No credit card, and this tour needs no login either.</p>",how:"Sign-up creates your login, your clinic and your admin staff record in one go. A confirmation email goes out so only real addresses get in.",apply:()=>world()},
  {t:"Choose a specialty pack",say:"<p>Mediflow isn't only a dental app. <b>Dental</b> comes fully loaded (tooth chart, sittings, price list). Other specialties start from the general clinic setup, and the <b>AI Builder</b> adds their tables and fields in minutes.</p><p>We'll use <b>Dental</b>, the pack this demo is fully loaded with.</p>",how:"A pack is <b>data, not code</b>: tables, fields, price lists and message templates installed into your clinic. That is why the AI Builder can reshape any pack later.",apply:()=>world()},
  {t:"Create the admin account",say:"<p>Your name, work email and password. We email a confirmation link and you sign in after clicking it.</p>",how:"No email? Check spam, then use <code>Resend confirmation email</code> on the sign-in page.",apply:()=>world()},
  {t:"Your pack is installed",say:"<p>The clinic opens fully set up: patients, appointments, treatment plans, billing, stock and WhatsApp templates.</p><p>Nothing is locked. Anything here can be changed by <b>chatting with the AI Builder</b>, as you'll see in chapter 3.</p>",how:"Each pack is installed per clinic, so your changes never affect another clinic.",apply:()=>world()}]},
 {id:"dash",title:"Dashboard & how it's calculated",url:"app.mediflow.in/dashboard",screen:(s)=>shell("dash",scrDash(["",  "appts","rev","util","ns","out","chart"][s]),"dashboard"),steps:[
  {t:"Your morning at a glance",say:"<p>This is what the owner sees on opening the app. Every number is <b>computed from live records</b>, not typed in.</p><p>Let's open the maths behind each tile.</p>",how:"Tiles are queries over appointments, invoices, treatment plans and stock for the clinic's calendar day.",apply:()=>world()},
  {t:"Appointments today",say:"<p>Completed visits plus the ones still to come. <b>Cancelled bookings are not counted</b>, so the figure is what the clinic will really handle.</p>",how:"<code>completed + confirmed</code> for today, excluding <code>cancelled</code> and <code>no_show</code>.",apply:()=>world()},
  {t:"Collected vs billed",say:"<p>Money in versus money earned. The gap is what patients still owe from today's visits, and the <b>collection rate</b> tells you how well the front desk is collecting.</p>",how:"Collected = paid invoices and recorded payments. Billed = fees of today's visits plus sittings completed today.",apply:()=>world()},
  {t:"Chair utilisation",say:"<p>How full the doctors' day really is: booked minutes divided by <b>available minutes</b>. Available time is working hours <b>minus breaks</b> for both doctors, so a lunch break never looks like an empty chair.</p>",how:"Uses each doctor's weekly schedule, breaks and leave. A doctor on leave contributes zero available minutes.",apply:()=>world()},
  {t:"No-show rate",say:"<p>No-shows divided by everyone who was expected to attend. A rising rate is your signal to switch on day-before WhatsApp reminders.</p>",how:"Looks back 30 days: <code>no_show ÷ (completed + no_show)</code>.",apply:()=>world()},
  {t:"Outstanding balances",say:"<p>Older dues plus whatever is still unpaid on <b>multi-sitting treatment plans</b>. When a patient pays in part, the balance simply moves down.</p><p>We'll make this number change live in chapter 6.</p>",how:"Plan balance = plan total after discount − payments recorded across sittings.",apply:()=>world()},
  {t:"Trends and doctors",say:"<p>The bars show collections for the last working days and today's load by doctor. Stock is also watched: gloves are already under their minimum, so a reorder alert is raised.</p>",how:"Stock alerts compare quantity with each item's minimum and update when treatments consume stock.",apply:()=>world()}]},
 {id:"bld",title:"AI Builder: make it yours",url:"app.mediflow.in/builder",screen:(s)=>shell("bld",scrBuilder(s),"builder"),steps:[
  {t:"Run your system by chatting",say:"<p>This is the heart of Mediflow. An admin describes what they need in plain words, and the AI Builder creates it: apps, tables, fields, dashboards, permissions.</p>",how:"The assistant plans, you preview, you approve, then it applies. Nothing is changed before approval.",apply:()=>world()},
  {t:"“Track my aligner trays”",say:"<p>A clinic that sells aligners needs a place to track them. We just say so. The AI proposes a new <b>Aligner Tray</b> object and a <b>recommended field list</b>.</p><p>Recommended fields come from what clinics like yours usually need. Untick what you don't want.</p>",how:"Recommendations are generated per object type. You can add more at any time by asking.",apply:()=>world()},
  {t:"Preview before anything happens",say:"<p>Underneath, the AI never writes free-form SQL. It produces a short <b>plan of safe actions</b>, which is checked twice. You can read exactly what will change before approving.</p>",how:"Whitelisted tools: <code>create_object</code>, <code>add_field</code>, <code>hide_field</code>, <code>create_app</code>, <code>add_tab</code>. Validated in the app and again in the database.",apply:()=>world()},
  {t:"Approved: a real app and table",say:"<p>One click and <b>Aligners</b> appears in the menu, backed by a <b>real table</b> in your private part of the database. It's saved as a change so it can be undone.</p>",how:"Tables live in a private <code>tenant_data</code> schema that's never exposed directly. Every change is logged in the audit trail.",apply:()=>world({bld:1,fresh:1})},
  {t:"Add more later, just ask",say:"<p>Need another field next month? Say so. Here we add <b>Refinement needed</b> and hide <b>Notes</b>. Hiding keeps the data, so nothing is ever lost by mistake.</p>",how:"<code>add_field</code> and <code>hide_field</code> run as one atomic change set. Hidden fields keep their stored values.",apply:()=>world({bld:1})},
  {t:"Dashboards and reports on request",say:"<p>“Show me trays due this week, by doctor.” The builder creates the report and pins it to a dashboard for that app. Any object, any scenario.</p>",how:"Reports are saved queries over your objects, rendered as charts or tables and refreshed live.",apply:()=>world({bld:1})},
  {t:"Permission sets and own-vs-all record access",say:"<p>Admins can control who sees and does what, the way large platforms do, by chatting: a person’s <b>role</b> sets the base, a <b>permission set</b> adds rights per table (read, create, edit, delete), and each right can be limited to <b>their own records</b> or <b>all records</b>.</p>",how:"Example: Receptionist role = read-only. Aligner Editor permission set adds create/edit. A doctor sees only their own patients' trays.",apply:()=>world({bld:1})},
  {t:"Undo anything, learn as you go",say:"<p>Changed your mind? <b>Undo</b> rolls the last change back safely, and rollback never deletes rows that hold data.</p><p>Aria also explains each concept while you work, so admins learn the system as they use it.</p>",how:"Every change set stores how to reverse it. Training prompts are built in so new admins ramp up without a manual.",apply:()=>world({bld:1})}]},
 {id:"chat",title:"Book by chat + WhatsApp number",url:"app.mediflow.in/chatbot",screen:(s)=>shell("chat",scrChat(s),"chatbot"),steps:[
  {t:"Booking in plain language",say:"<p>The front desk (or a patient on WhatsApp) can just type. Aria understands names, dates like “tomorrow” or “Friday”, times and reasons.</p>",how:"Rule-based parsing handles the common phrases instantly. An AI model can step in for messier messages.",apply:()=>world()},
  {t:"It asks for the WhatsApp number",say:"<p>Meera isn't in the system, and no number was given. So Aria <b>asks for her WhatsApp number</b> before anything else.</p><p>The number is more than contact info: it's how we recognise a patient later.</p>",how:"Phone is normalised to the last 10 digits, so “+91 98450 12345” and “9845012345” match.",apply:()=>world()},
  {t:"Only real free times are offered",say:"<p>No match for that number, so a new record will be created. Aria then shows <b>only times that are truly free</b>, after checking schedules, breaks, leave and existing bookings.</p><p>Tap any time to continue.</p>",how:"Free times come from the same rules as the calendar (chapter 5). Past times and double-bookings can't appear.",apply:()=>world()},
  {t:"Booked, patient created, WhatsApp sent",say:"<p>One tap and everything happens together: the <b>patient is created automatically</b>, a doctor is assigned, the appointment is saved and <b>Meera gets her confirmation on WhatsApp</b>. The doctor is notified too.</p><p>Try a different time chip and watch the doctor choice update.</p>",how:"Patient upsert + slot check + save happen in one database transaction. Two people booking one slot at once can't both succeed.",apply:()=>world({meera:1})},
  {t:"Returning patients: no duplicates",say:"<p>Now Rahul, who already exists. Aria finds him by name and <b>reuses his saved number</b>, so nobody is asked twice. He's booked with <b>his usual doctor</b>, and no duplicate record is created.</p>",how:"A shared family phone is handled too: same number, different name → a separate patient record, flagged as shared.",apply:()=>world({meera:1,rahul:1})}]},
 {id:"cal",title:"Calendar & doctor assignment",url:"app.mediflow.in/calendar",screen:(s)=>shell("cal",scrCal(s),"calendar"),steps:[
  {t:"Every doctor in one view",say:"<p>Each column is a doctor. Bookings from the chat are right here (outlined in green), together with <b>breaks</b> and everything that's already <b>in the past</b> today.</p>",apply:()=>{world({meera:1,rahul:1});UI.day=D0;UI.asg={pid:"p1",date:D0,time:660}},how:"The calendar and the assistant read the same schedule, so they can never disagree."},
  {t:"Schedules decide what's bookable",say:"<p>Hatched areas can't be booked: before opening, after closing and lunch breaks. Each doctor has their own weekly hours, break and slot length, set on the Availability page.</p>",how:"Rules checked per slot: clinic closed, doctor on leave, outside hours, break, time passed, already booked.",apply:()=>{world({meera:1,rahul:1});UI.day=D0}},
  {t:"Leave blocks the day",say:"<p>Dr. Mehta is on leave tomorrow, so his whole column is blocked. Nobody can book him that day, in the app or via chat.</p><p>Use the <b>Mark on leave</b> buttons to try it with either doctor.</p>",how:"Adding leave also warns you how many already-confirmed appointments fall inside it, so you can move them.",apply:()=>{world({leave:["arjun|"+D1]});UI.day=D1;UI.asg={pid:"p2",date:D1,time:630}}},
  {t:"Usual doctor is busy → next free doctor",say:"<p>Rahul's usual doctor is Dr. Sharma, but she's with another patient at 11:00. So the system moves him to a <b>doctor who is free</b>. See the reasoning on the right.</p><p>Change the patient, day or time to try your own case.</p>",how:"Rule per clinic, configurable: <code>usual_then_free</code> (default), <code>least_loaded</code> (the least busy doctor), or ask the receptionist. Admins change it by telling the AI Builder, and set the slot length the same way.",apply:()=>{world();UI.day=D0;UI.asg={pid:"p1",date:D0,time:660}}},
  {t:"Usual doctor is free → they get the patient",say:"<p>At 11:30 Dr. Sharma is free, so Rahul simply goes to her. Continuity of care is the default, and the assignment is remembered for next time.</p><p>Press <b>Book it</b> and the slot appears on the calendar.</p>",how:"Booking records <code>patient ↔ doctor</code> as an assignment, so each doctor can list their own patients.",apply:()=>{world();UI.day=D0;UI.asg={pid:"p1",date:D0,time:690}}}]},
 {id:"treat",title:"Three-sitting treatment",url:"app.mediflow.in/treatments",screen:(s)=>shell("treat",scrTreat(s),"treatments"),steps:[
  {t:"A procedure that needs three visits",say:"<p>Anita needs a molar root canal, which takes <b>three sittings</b>. In most apps that's three unrelated appointments. Here it's <b>one treatment plan</b>.</p><p>Create it from a template.</p>",how:"Templates (root canal, implant…) hold the sittings, typical gaps and consumables, and are editable.",apply:()=>setPlan(0)},
  {t:"Dates are booked for you",say:"<p>The plan creates all three sittings at once: <b>today, then 7 days apart</b>, each at the same time with the same doctor. If a date isn't available, it moves to the <b>next day the doctor is free</b> and says so.</p>",how:"Each sitting is a real appointment, so it shows in the calendar and blocks the slot like any other booking.",apply:()=>setPlan(1)},
  {t:"How the amount is calculated",say:"<p>Each sitting has its own amount. <b>Plan total = sum of sittings − discount.</b> Try the 5% and 10% buttons: every sitting is billed at its fair share of the discounted total.</p><p>Paid and balance always add up to the plan total.</p>",how:"Per-sitting bill = sitting amount × (plan total ÷ sum of sittings). Rounded to whole rupees.",apply:()=>setPlan(2)},
  {t:"Sitting 1 done: invoice, stock, next reminder",say:"<p>Marking sitting 1 complete triggers three things <b>automatically</b>: an <b>invoice</b> for just that sitting, <b>stock deducted</b> (anaesthetic, gloves, files), and a <b>WhatsApp reminder</b> queued for the day before sitting 2.</p>",how:"Consumables per sitting come from the template, so stock stays accurate without anyone counting.",apply:()=>setPlan(3)},
  {t:"Part-payments move the balance",say:"<p>Patient pays for sitting 1 only. The <b>balance</b> drops, a receipt goes on WhatsApp, and the treatment and payment bars update separately. The rest stays on the plan.</p><p>Look at Outstanding on the dashboard: it follows this balance.</p>",how:"Payment progress and treatment progress are tracked independently, so you always see what's done versus what's paid.",apply:()=>setPlan(4)},
  {t:"Finish the plan",say:"<p>Sittings 2 and 3 follow the same way. At the end: every sitting done, invoiced and paid, stock updated, and the full history sits on Anita's record.</p>",how:"If a patient misses a sitting, mark no-show: the remaining sittings stay on the plan and new slots are offered.",apply:()=>setPlan(5)},
  {t:"Surgery with long healing gaps",say:"<p>An <b>implant</b> is also three stages, but with longer gaps: <b>14 days</b> for the healing check and <b>90 days</b> before the crown. Same plan, different template.</p><p>Notice each date is checked against the doctor's calendar.</p>",how:"Gap rules are per template; each date then goes through the same slot check as any booking.",apply:()=>setPlan(6)}]},
 {id:"wa",title:"WhatsApp, automatically",url:"app.mediflow.in/appointments",screen:(s)=>shell("wa",scrWa(s),"whatsapp"),steps:[
  {t:"Every step has a message",say:"<p>Patients and doctors are informed at each moment: booking, reminder, change, cancellation, next sitting and payment. Click any message type to see what the patient receives.</p>",how:"Every message attempt is logged per appointment: sent, failed or link prepared.",apply:()=>{world({meera:1});UI.wa={kind:"confirm",mode:"api"}}},
  {t:"Confirmation: patient and doctor",say:"<p>The moment an appointment is saved, the patient gets date, time, doctor, fee and address. The doctor gets a short note, including whether it's a <b>new patient</b>.</p>",how:"Messages are templated, so wording matches your clinic. Automatic sending uses the WhatsApp Cloud API.",apply:()=>{world();UI.wa={kind:"confirm",mode:"api"}}},
  {t:"Reminders cut no-shows",say:"<p>A reminder goes out the day before, because an admin told the AI Builder: <i>“Every day, remind patients a day before their appointment.”</i> That is an <b>automation flow</b>.</p>",how:"Flows run on an event (booked, cancelled, completed, no-show, invoice paid, stock low, a record saved) or on a schedule. Admins create and pause them by chatting; the Flows tab shows what each one did.",apply:()=>{world();UI.wa={kind:"remind",mode:"api"}}},

  {t:"Treatments and payments",say:"<p>For multi-sitting plans, patients get a reminder before each sitting and a <b>receipt</b> whenever a payment is recorded, with the balance remaining.</p>",how:"Same engine; these templates are attached to treatment plans and invoices.",apply:()=>{world();UI.wa={kind:"sitting",mode:"api"}}},

 {id:"ops",title:"Run the clinic: billing, stock, staff",url:"app.mediflow.in/billing",screen:scrOps,steps:[
  {t:"Invoices and part payments",say:"<p>Every visit and sitting becomes an invoice with its own number. Take a part payment and the balance stays on the invoice. <b>Print</b> gives a clean copy for the patient.</p>",how:"Invoice numbers are per clinic. Collected vs billed on the dashboard comes from these same invoices.",apply:()=>world()},

  {t:"Users: only the admin removes people",say:"<p>The <b>Users</b> screen lists everyone in <i>your</i> clinic. Only the admin can remove a user, never themselves or the last admin.</p>",how:"Other clinics are never visible or touched. Removing someone keeps their history and is logged.",apply:()=>world()},

const TTS=typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined";
let voiceOn=false,voice=null,tok=0,speaking=false;
function pickVoice(){if(!TTS)return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang)&&/female|zira|samantha|aria|jenny|google uk english female/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim()};
function cancelSpeech(){tok++;speaking=false;if(TTS)try{speechSynthesis.cancel()}catch(e){}}
function speak(text,done){
  cancelSpeech();const my=tok;speaking=true;
  const parts=(text.match(/[^.!?:]+[.!?:]*/g)||[text]).map(x=>x.trim()).filter(Boolean);let i=0,fin=false;
  const finish=()=>{if(fin||my!==tok)return;fin=true;speaking=false;if(done)done()};
  const safety=setTimeout(finish,4000+text.length*90);
  const nextPart=()=>{
    if(my!==tok)return;
    if(i>=parts.length){clearTimeout(safety);finish();return}
    const u=new SpeechSynthesisUtterance(parts[i++]);if(voice){u.voice=voice;u.lang=voice.lang}else u.lang="en-IN";
    u.rate=1;u.pitch=1.05;u.onend=nextPart;u.onerror=nextPart;
    try{speechSynthesis.speak(u)}catch(e){clearTimeout(safety);finish()}
  };
  nextPart();
}

}
function renderQuiz(){
  const c=CH[pos.c],qz=c.quiz,Q=ST.q[c.id]||(ST.q[c.id]={i:0,tries:0,wrong:[],ok:false,finished:false,score:0}),el=$("#task");
  el.hidden=false;el.className="task quiz"+(Q.finished?" done":"");
  if(Q.finished){const b=BADGE[c.id];el.innerHTML='<b class="k">Module complete</b><div class="qq">'+b[0]+" "+b[1]+' badge earned</div><div class="why">'+Q.score+" of "+qz.length+" right first time. Nicely done.</div>"+(pos.c<CH.length-1?'<button class="btn primary sm" data-act="next">Next module →</button>':"");return}
  const q=qz[Q.i];
  el.innerHTML='<b class="k">Knowledge check '+(Q.i+1)+" of "+qz.length+'</b><div class="qq">'+q.q+"</div>"+q.o.map((o,j)=>'<button class="opt'+(Q.ok&&j===q.a?" right":Q.wrong.includes(j)?" wrong":"")+'" data-act="qa" data-v="'+j+'"'+(Q.ok?" disabled":"")+">"+o+"</button>").join("")+
   (Q.ok?'<div class="why">✓ '+q.why+'</div><button class="btn primary sm" data-act="qn">'+(Q.i<qz.length-1?"Next question →":"Finish module")+"</button>":Q.wrong.length?'<div class="why">Not quite. Try another answer.</div>':"");
}
function renderTask(){
  const st=stepOf(),el=$("#task");
  if(st.quiz){renderQuiz();return}
  if(!st.task){el.hidden=true;return}
  const d=ST.done[key()];el.hidden=false;el.className="task"+(d?" done":"");
  el.innerHTML=d?'<b class="k">✓ Task complete</b>'+(st.task.after||"Well done."):'<b class="k">Your turn</b>'+st.task.text+'<div class="tr"><button class="btn sm" data-act="doit">Do it for me</button></div>';
}
function renderRail(){
  const c=CH[pos.c],st=stepOf(),L=linesOf(st);
  renderTop();
  $("#say").innerHTML='<div class="mod">Unit '+(pos.s+1)+" of "+c.steps.length+'</div><h2>'+st.t+'</h2><div class="lines" id="lines">'+L.map((l,i)=>'<div class="ln">'+l+"</div>").join("")+"</div>";
  if(curLine>=0)showLine(Math.min(curLine,L.length-1));
  const how=$("#how");how.hidden=!st.how;how.innerHTML=st.how?"<b>Under the hood</b>"+st.how:"";
  renderTask();
  $("#prog").style.width=Math.round((flat()+1)/total*100)+"%";
  $("#bBack").disabled=flat()===0;
  const last=flat()===total-1;
  const open=(st.task&&!ST.done[key()])||(st.quiz&&!(ST.q[c.id]&&ST.q[c.id].finished));
  $("#bNext").textContent=last?"Done ✓":open?"Skip →":"Next →";$("#bNext").disabled=last;
}
function render(){renderRail();renderScreen()}

/* ───────────── the presenter: reads the script line by line ───────────── */
function startScript(){clearTimeout(timer);++runTok;curLine=-1}
function say(html){
  const l=$("#lines");if(!l)return;const d=document.createElement("div");d.className="ln cur";d.innerHTML=html;
  l.querySelectorAll(".ln").forEach(e=>{e.classList.remove("cur");e.classList.add("said")});l.appendChild(d);
  
}
function awardTask(){const k=key();if(ST.done[k])return false;ST.done[k]=1;ST.pts+=10;toast("+10 points");renderTop();renderTask();return true}
function completeTask(){
  const st=stepOf(),first=awardTask(),my=runTok;
  if(st.task.advance){clearTimeout(timer);setTimeout(()=>{if(my===runTok)next()},first?800:250)}
  else if(first&&st.task.after)say(st.task.after);
  renderRail_btn();
}
function renderRail_btn(){const st=stepOf();const open=(st.task&&!ST.done[key()]);$("#bNext").textContent=flat()===total-1?"Done ✓":open?"Skip →":"Next →"}
function taskEvent(id){const st=stepOf();if(st.task&&st.task.id===id){completeTask();return true}return false}
function nudge(){const t=$("#task");t.classList.remove("nudge");void t.offsetWidth;t.classList.add("nudge")}

/* ───────────── controller ───────────── */
function applyStep(){const a=stepOf().apply;if(a)a()}
function go(c,s){
  pos.c=c;pos.s=s;UI.undone=false;UI.target=null;
  if(c>0||s>=3)ensureSu();
  if(c===chIdx("end"))ST.seen.end=1;
  applyStep();render();startScript();
}
function next(){const c=CH[pos.c];if(pos.s<c.steps.length-1)go(pos.c,pos.s+1);else if(pos.c<CH.length-1)go(pos.c+1,0);else setMode("hands")}
function back(){if(pos.s>0)go(pos.c,pos.s-1);else if(pos.c>0)go(pos.c-1,CH[pos.c-1].steps.length-1)}
function setMode(m){ST.mode="hands";clearTimeout(timer);return;
  ST.mode=m;clearTimeout(timer);renderTop();
  if(m==="watch"){const my=runTok;if(!speaking)watchAdvance(my)}
}
function setVoice0(on){voiceOn=on&&TTS;if(!voiceOn){cancelSpeech();setTalk(false)}const b=$("#voiceBtn");if(b)b.textContent=voiceOn?"🔊 Voice on":"🔇 Voice off";const b2=$("#voiceBtn2");if(b2)b2.textContent=voiceOn?"🔊":"🔇"}
function showErr(id,m){const e=$(id);if(e)e.textContent=m;nudge()}
const KPISTEP={appts:1,newp:1,rev:2,util:3,ns:4,out:5,stock:6};

function doAct(a,v,el){
  switch(a){
    case"next":if(ST.mode==="watch")setMode("hands");next();break;
    case"back":if(ST.mode==="watch")setMode("hands");back();break;
    
    
    
    
    case"startquiet":$("#intro").hidden=true;go(0,0);break;
    case"restart":ST.pts=0;ST.done={};ST.badges=[];ST.q={};ST.seen={};UI.su={clinic:"",city:"",phone:"",name:"",email:"",pw:"",pw2:"",lpw:"",spec:"",verified:false};UI.phone="98450 12345";UI.recs={ipr:true,attach:false};setMode("hands");go(0,0);break;
    case"chap":if(ST.mode==="watch")setMode("hands");go(+v,0);$("#chapters").hidden=true;$("#mapBtn").setAttribute("aria-expanded","false");break;
    case"map":{const h=$("#chapters").hidden;$("#chapters").hidden=!h;$("#mapBtn").setAttribute("aria-expanded",h?"true":"false");break}
    case"goto":go(chIdx(el.dataset.ch),0);break;
    case"theme":{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";break}
    case"doit":{const st=stepOf();if(st.task&&!ST.done[key()])st.task.auto();break}
    /* quiz */
    case"qa":{const c=CH[pos.c],Q=ST.q[c.id],q=c.quiz[Q.i],j=+v;if(Q.ok)break;
      if(j===q.a){Q.ok=true;if(Q.tries===0){Q.score++;ST.pts+=10;toast("+10 points");renderTop()}}else{Q.tries++;Q.wrong.push(j)}renderQuiz();break}
    case"qn":{const c=CH[pos.c],Q=ST.q[c.id];Q.i++;Q.tries=0;Q.wrong=[];Q.ok=false;
      if(Q.i>=c.quiz.length){Q.finished=true;if(!ST.badges.includes(c.id)){ST.badges.push(c.id);ST.pts+=50;toast("Badge earned: "+BADGE[c.id][1]+"  +50")}renderTop();$("#prog").style.width=Math.round((flat()+1)/total*100)+"%";renderTask();renderRail_btn();say("Badge earned: <b>"+BADGE[c.id][0]+" "+BADGE[c.id][1]+"</b>. On to the next module whenever you're ready.")}else renderQuiz();break}
    /* sign-up & login */
    case"su-go":{const m=suValid(v);if(m){showErr("#suErr",m);break}if(!taskEvent("su_"+v))next();break}
    case"su-spec":UI.su.spec=v;renderScreen();if(v==="dental")taskEvent("su_spec");break;
    case"su-confirm":UI.su.verified=true;renderScreen();if(!taskEvent("su_verify")){}break;
    case"su-login":{const m=suValid("login");if(m){showErr("#suErr",m);break}if(!taskEvent("su_login"))next();break}
    /* dashboard */
    case"kpi":{if(KPISTEP[v]==null)break;if(taskIs("d_kpi"))awardTask();if(CH[pos.c].id==="dash")go(pos.c,KPISTEP[v]);break}
    /* builder */
    case"bsend":taskEvent("b_send");break;
    case"bapprove":taskEvent("b_approve");break;
    case"bundo":UI.undone=true;renderScreen();taskEvent("b_undo");break;
    case"rec":UI.recs[v]=!UI.recs[v];renderScreen();taskEvent("b_field");break;
    /* chat */
    case"csend":{const st=stepOf();if(!st.task||!/^c_/.test(st.task.id))break;
      if(st.task.id==="c_phone"&&UI.phone.replace(/\D/g,"").length<10){showErr("#cErr","That doesn't look like a 10-digit number. Try again.");break}
      completeTask();break}
    case"pick":{UI.pick=+v;const ci=chIdx("chat");if(taskIs("c_pick")){completeTask()}else if(pos.c===ci&&pos.s<3){go(ci,3)}else{applyStep();render()}break}
    /* calendar */
    case"day":UI.day=v;renderScreen();break;
    case"leave":{const k=v+"|"+UI.day;S.leaves.has(k)?S.leaves.delete(k):S.leaves.add(k);renderScreen();taskEvent("cal_leave");break}
    case"bookit":{unbook("asg");const r=resolveDoctor(UI.asg.pid,UI.asg.date,UI.asg.time);if(r.doc){book({date:UI.asg.date,start:UI.asg.time,doc:r.doc.id,pid:UI.asg.pid,reason:"Check-up",fee:FEE[r.doc.id],tag:"asg"});UI.day=UI.asg.date}renderScreen();taskEvent("cal_book");break}
    /* treatment */
    case"mkplan":createPlan(v,0);renderScreen();taskEvent("t_plan");break;
    case"complete":completeSit(+v);renderScreen();taskEvent("t_complete");break;
    case"pay":paySit(+v);renderScreen();taskEvent("t_pay");break;
    case"disc":S.plan.disc=+v;renderScreen();break;
    /* whatsapp */
    case"wak":UI.wa.kind=v;renderScreen();taskEvent("wa_kind");break;
    case"wam":UI.wa.mode=v;renderScreen();break;
  }
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&!el.disabled)doAct(el.dataset.act,el.dataset.v,el)});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.su){UI.su[t.dataset.su]=t.value;if(t.dataset.su==="pw"){const m=$("#pwMeter");if(m)m.innerHTML=pwMeter(t.value)}}
  else if(t.dataset.in==="phone")UI.phone=t.value;
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-bind]");if(!el)return;
  const k=el.dataset.bind;UI.asg[k]=(k==="time")?+el.value:el.value;unbook("asg");renderScreen();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("input")){
    const go2=document.querySelector('#screen [data-act="su-go"],#screen [data-act="su-login"],#screen [data-act="csend"]');
    if(go2){e.preventDefault();go2.click()}return}
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="ArrowRight")doAct("next");else if(e.key==="ArrowLeft")doAct("back");
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("kpi")){e.preventDefault();e.target.click()}
});

seed();BASE=kpis();

render();
})();

</script>
</body></html>
