<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mediflow Demo</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#eef1f8; --line:#dde2ee; --fg:#0f172a; --muted:#5b6478;
  --accent:#2563eb; --accent2:#7c3aed; --accent-soft:#e6eeff; --accent-fg:#ffffff;
  --ok:#0f9f6e; --ok-soft:#dcf5ea; --warn:#b7791f; --warn-soft:#fdf0d5; --bad:#d6364a; --bad-soft:#fde4e8;
  --doc1:#2563eb; --doc1-soft:#dbe7ff; --doc2:#c2410c; --doc2-soft:#ffe6d6;
  --wa:#1fa855; --wa-bg:#e7f7ee; --wa-bubble:#d9fdd3; --wa-chat:#efeae2; --hatch:#e3e7f1;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#131a2e; --surface2:#1a2340; --line:#27324f; --fg:#e8ecf7; --muted:#9aa5c0;
  --accent:#6d9bff; --accent2:#a78bfa; --accent-soft:#1c2a52; --accent-fg:#0b1020;
  --ok:#3ddc97; --ok-soft:#10382b; --warn:#f2b84b; --warn-soft:#3b2d0f; --bad:#ff6b81; --bad-soft:#40161f;
  --doc1:#7aa5ff; --doc1-soft:#1b2c57; --doc2:#ff9f66; --doc2-soft:#47260f;
  --wa:#3ddc97; --wa-bg:#10382b; --wa-bubble:#0f3d2e; --wa-chat:#0d1a17; --hatch:#222c49; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#131a2e; --surface2:#1a2340; --line:#27324f; --fg:#e8ecf7; --muted:#9aa5c0;
  --accent:#6d9bff; --accent2:#a78bfa; --accent-soft:#1c2a52; --accent-fg:#0b1020;
  --ok:#3ddc97; --ok-soft:#10382b; --warn:#f2b84b; --warn-soft:#3b2d0f; --bad:#ff6b81; --bad-soft:#40161f;
  --doc1:#7aa5ff; --doc1-soft:#1b2c57; --doc2:#ff9f66; --doc2-soft:#47260f;
  --wa:#3ddc97; --wa-bg:#10382b; --wa-bubble:#0f3d2e; --wa-chat:#0d1a17; --hatch:#222c49; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-inline:16px;padding-block:16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:1320px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800}
.top-r{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.pill.btn:hover{border-color:var(--accent);color:var(--accent)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:1fr}}

/* narrator */
.rail{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);position:sticky;top:12px;overflow-x:hidden;overflow-y:auto;max-height:calc(100vh - 24px);min-width:0}
@media(max-width:980px){.rail{position:static;max-height:none}}
.chapters{display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
@media(max-width:980px){.chapters{flex-direction:row;overflow-x:auto;overflow-y:hidden}}
.chap{display:flex;gap:10px;align-items:center;padding:9px 14px;border:0;background:transparent;text-align:left;border-left:3px solid transparent;color:var(--muted);white-space:nowrap}
.chap .n{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.chap.done .n{background:var(--ok-soft);color:var(--ok)}
.chap.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}
.chap.on .n{background:var(--accent);color:var(--accent-fg)}
@media(max-width:980px){.chap{border-left:0;border-bottom:3px solid transparent}.chap.on{border-bottom-color:var(--accent)}}
.say{padding:16px 16px 6px}
.aria{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.aria .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;display:grid;place-items:center;font-size:13px}
.aria b{font-size:13px}.aria span{font-size:12px;color:var(--muted)}
.say h2{font-size:18px;line-height:1.3;margin-bottom:8px;text-wrap:balance}
.say .txt{color:var(--fg);font-size:14px}
.say .txt p+p{margin-top:8px}
.how{margin:12px 16px 0;border:1px dashed var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.how b{color:var(--fg);display:block;margin-bottom:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.how code{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:11.5px;color:var(--fg)}
.ctl{display:flex;align-items:center;gap:8px;padding:14px 16px 16px}
.ctl .grow{flex:1;height:5px;background:var(--surface2);border-radius:9px;overflow:hidden}
.ctl .grow i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg);border:0}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ok{background:var(--ok);color:#fff;border:0}
.btn.danger{color:var(--bad)}

/* app frame */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.url{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:600px}
@media(max-width:720px){.app{grid-template-columns:1fr}}
.side{background:var(--surface2);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
@media(max-width:720px){.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}}
.side .cl{padding:4px 8px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.side .cl small{display:block;font-weight:400;color:var(--muted);font-size:11px}
@media(max-width:720px){.side .cl{display:none}}
.nav{padding:7px 10px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
button.nav{border:0;background:transparent;text-align:left;font:inherit;width:100%}
button.nav:hover{background:var(--surface)}
.nav.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav.new{animation:pop .5s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.main{padding:18px;min-width:0}
.main h3.pg{font-size:19px;margin-bottom:2px}
.main .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);min-width:0}
.card.hl{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .f{margin-top:8px;font-size:12px;background:var(--accent-soft);border-radius:8px;padding:6px 8px;color:var(--fg);font-variant-numeric:tabular-nums;animation:pop .35s}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted);min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px}
.bars .b.today i{outline:2px solid var(--accent);outline-offset:1px}
.bars .b em{font-style:normal;color:var(--fg);font-size:11px;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.mono{font-variant-numeric:tabular-nums}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-width:0}
.chatscroll{max-height:430px;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13.5px;animation:pop .3s;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.msg .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font-size:12px}
.chip:hover{border-color:var(--accent)}.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip small{color:var(--muted);margin-left:4px}.chip.sel small{color:inherit;opacity:.8}
.composer{display:flex;gap:8px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;background:var(--surface);align-items:center}
.composer span{flex:1;color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* checklist of behind the scenes */
.trace{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.trace li{display:flex;gap:8px;align-items:flex-start;animation:pop .3s}
.trace li i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-style:normal;font-size:11px;margin-top:1px}
.trace li.no i{background:var(--bad-soft);color:var(--bad)}
.trace li.go i{background:var(--accent-soft);color:var(--accent)}
.trace small{display:block;color:var(--muted);font-size:12px}

/* phone */
.phone{width:min(100%,290px);margin:0 auto;border:8px solid #111827;border-radius:30px;overflow:hidden;background:var(--wa-chat);box-shadow:var(--shadow)}
.phone .ph{background:#0b6b4f;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:13px}
.phone .ph .av{width:26px;height:26px;border-radius:50%;background:#fff;color:#0b6b4f;display:grid;place-items:center;font-weight:800;font-size:12px}
.phone .ph small{display:block;font-size:10px;opacity:.8}
.phone .pb{padding:10px;min-height:250px;display:flex;flex-direction:column;gap:6px;color:#111}
.phone .wb{background:var(--wa-bubble);color:#111;border-radius:10px 10px 10px 2px;padding:7px 9px;font-size:12px;line-height:1.4;max-width:94%;white-space:pre-wrap;animation:pop .35s;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.phone .wb.me{align-self:flex-end;background:#fff;border-radius:10px 10px 2px 10px}
.phone .wb time{display:block;text-align:right;font-size:10px;color:#667781;margin-top:2px}
:root[data-theme="dark"] .phone .wb{color:#e8ecf7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .phone .wb{color:#e8ecf7}}
:root[data-theme="dark"] .phone .wb.me{background:#202c33}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .phone .wb.me{background:#202c33}}

/* calendar */
.cal{display:grid;grid-template-columns:54px repeat(2,minmax(120px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12px;min-width:360px}
.cal .hd{padding:8px;background:var(--surface2);font-weight:600;border-bottom:1px solid var(--line);text-align:center}
.cal .tm{color:var(--muted);text-align:right;padding:0 6px;height:34px;border-bottom:1px solid var(--line);font-size:11px;line-height:34px;background:var(--surface2)}
.cal .col{position:relative;border-left:1px solid var(--line)}
.cal .cell{height:34px;border-bottom:1px solid var(--line)}
.cal .ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 7px;font-size:11.5px;overflow:hidden;border-left:4px solid;line-height:1.25;animation:pop .35s}
.cal .ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.d1{background:var(--doc1-soft);border-color:var(--doc1)}.cal .ev.d2{background:var(--doc2-soft);border-color:var(--doc2)}
.cal .ev.completed{opacity:.6}
.cal .ev.new{box-shadow:0 0 0 2px var(--ok)}
.cal .ev.sit{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(124,58,237,.12) 6px 12px)}
.cal .brk{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);display:grid;place-items:center;color:var(--muted);font-size:11px}
.cal .off{position:absolute;inset:0;background:var(--hatch);display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:600;padding:10px}
.cal .past{position:absolute;left:0;right:0;top:0;background:color-mix(in srgb,var(--surface) 70%,transparent);border-bottom:2px solid var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs .btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
select,input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
label.lb{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.field{min-width:0}
.sit{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sit .no{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700}
.sit.done .no{background:var(--ok);color:#fff}.sit.next .no{background:var(--accent);color:#fff}
.sit .meta{font-size:12px;color:var(--muted)}
.prog{height:8px;background:var(--surface2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;transition:width .4s}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.calc .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.calc .r{text-align:right}
.note{font-size:12px;color:var(--muted)}
.callout{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--accent-soft)}
.callout.ok{background:var(--ok-soft)}.callout.warn{background:var(--warn-soft)}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.spec{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left}
.spec .e{font-size:22px}.spec b{display:block;margin-top:4px}.spec small{color:var(--muted);font-size:12px}
.spec.on{border-color:var(--accent);background:var(--accent-soft)}
.form .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
@media(max-width:640px){.form .row{grid-template-columns:1fr}}
.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-height:36px}
.inp.fill{border-color:var(--accent)}
.inp.empty{color:var(--muted)}
.cb{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.cb i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--accent-fg);flex:none}
.cb.on i{background:var(--accent);border-color:var(--accent)}
.cb em{font-style:normal;color:var(--muted);font-size:12px;margin-left:auto}
pre.json{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11.5px;overflow-x:auto;color:var(--fg)}
.sw{display:flex;gap:10px;align-items:center;font-size:13px}
.sw .t{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on .t{background:var(--ok)}.sw.on .t::after{left:18px}
.end{text-align:center;padding:30px 10px}
.end h3{font-size:22px;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.intro{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.intro[hidden]{display:none}
.intro .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);max-width:460px;width:100%;padding:26px;text-align:center}
.intro h1{font-size:22px;margin:12px 0 8px;text-wrap:balance}
.intro p{color:var(--muted);margin-bottom:18px}
.intro .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.speaking{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-left:6px;vertical-align:middle}
.speaking i{width:3px;background:var(--accent);border-radius:2px;animation:eq .8s infinite ease-in-out}
.speaking i:nth-child(2){animation-delay:.15s}.speaking i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
</style>
</head><body>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo">M</span> Mediflow <span class="pill">Guided demo · no login needed</span></div>
    <div class="top-r">
      <button class="pill btn" data-act="voice" id="voiceBtn">🔇 Voice off</button>
      <button class="pill btn" data-act="restart">↺ Restart tour</button>
      <button class="pill btn" data-act="theme" id="themeBtn">◐ Theme</button>
    </div>
  </div>
  <div class="layout">
    <aside class="rail" aria-label="Tour guide">
      <nav class="chapters" id="chapters"></nav>
      <div class="say" id="say"></div>
      <div class="how" id="how" hidden></div>
      <div class="ctl">
        <button class="btn" data-act="back" id="bBack">←</button>
        <button class="btn primary" data-act="next" id="bNext">Next →</button>

<div class="intro" id="intro" role="dialog" aria-label="Start the guided demo">
  <div class="box">

    <h1>Mediflow guided demo</h1>
    <p id="introTxt">Aria will talk you through every module, from building a custom app to booking, doctor assignment, three-sitting treatments and WhatsApp. About 6 minutes. Turn your sound on.</p>

<script>
(function(){
"use strict";
/* ───────────── tiny helpers ───────────── */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const wd=s=>parseD(s).getDay();
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nice=s=>{const d=parseD(s);return DN[d.getDay()]+" "+d.getDate()+" "+MN[d.getMonth()]};
const fmt=m=>{let h=Math.floor(m/60);const mi=m%60,p=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(mi)+" "+p};
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;

/* ───────────── demo calendar ───────────── */
const base=new Date(); if(base.getDay()===6)base.setDate(base.getDate()+2); else if(base.getDay()===0)base.setDate(base.getDate()+1);
const D0=iso(base); let D1=addD(D0,1); if(wd(D1)===0)D1=addD(D1,1);
const NOW=10*60+30, DUR=30, FEE={priya:800,arjun:1200}; // the demo clock is frozen at 10:30 AM

/* ───────────── domain: doctors, rules, slots ───────────── */
const DOCS=[
  {id:"priya",name:"Dr. Priya Sharma",short:"Dr. Sharma",role:"Orthodontist",cls:"d1",hours:{1:[540,1020],2:[540,1020],3:[540,1020],4:[540,1020],5:[540,1020],6:[540,780]},brk:[780,840]},
  {id:"arjun",name:"Dr. Arjun Mehta",short:"Dr. Mehta",role:"Endodontist",cls:"d2",hours:{1:[600,1080],2:[600,1080],3:[600,1080],4:[600,1080],5:[600,1080],6:[600,840]},brk:[810,870]}
];
const docById=id=>DOCS.find(d=>d.id===id);
const ORDER=[...DOCS].sort((a,b)=>a.name.localeCompare(b.name)); // "first free doctor" order

let S; // all mutable demo state
function seed(){
  S={
    leaves:new Set(),
    patients:[
      {id:"p1",name:"Rahul Gupta",phone:"98100 11111",usual:"priya"},
      {id:"p2",name:"Anita Sharma",phone:"98100 22222",usual:"arjun"},
      {id:"p3",name:"Kiran Patel",phone:"98100 33333",usual:"priya"},
      {id:"p4",name:"Deepa Nair",phone:"98100 44444",usual:"arjun"},
      {id:"p5",name:"Mohammed Farhan",phone:"98100 55555",usual:"priya"}
    ],
    appts:[],nid:1,
    stock:[
      {n:"Anaesthetic cartridges",q:120,min:40,u:"pcs"},{n:"Gloves (M)",q:48,min:50,u:"pairs"},
      {n:"Endo files (K-file)",q:30,min:12,u:"pcs"},{n:"Gutta-percha points",q:64,min:25,u:"pcs"},
      {n:"Implant fixtures",q:6,min:3,u:"pcs"},{n:"Composite A2",q:14,min:6,u:"syringes"}
    ],
    plan:null, bld:{applied:false,fresh:false}
  };
  const A=(date,start,doc,pid,reason,fee,st)=>S.appts.push({id:"a"+S.nid++,date,start,dur:DUR,doc,pid,reason,fee,status:st||"confirmed"});
  A(D0,540,"priya","p1","Braces tightening",800,"completed");
  A(D0,570,"priya","p3","Extraction consult",600,"completed");
  A(D0,660,"priya","p5","Crown fitting",800);
  A(D0,600,"arjun","p2","RCT follow-up",1200,"completed");
  A(D0,630,"arjun","p4","Cleaning",500);
  A(D0,720,"arjun","p3","Filling",700);
  A(D1,570,"priya","p5","Review",800);
  A(D1,660,"priya","p4","Whitening",1500);
  A(D1,600,"arjun","p3","Root canal",1200);
  A(D1,720,"arjun","p2","Crown prep",1200);
}
const patient=id=>S.patients.find(p=>p.id===id);
const apptsOn=d=>S.appts.filter(a=>a.date===d).sort((a,b)=>a.start-b.start);

/* the same rules the real engine enforces (appt_check_slot) */
function checkSlot(doc,date,start,dur){
  dur=dur||DUR;
  if(wd(date)===0)return"clinic_closed";
  if(S.leaves.has(doc.id+"|"+date))return"on_leave";
  const h=doc.hours[wd(date)];
  if(!h||start<h[0]||start+dur>h[1])return"outside_hours";
  if(start<doc.brk[1]&&start+dur>doc.brk[0])return"break";
  if(date===D0&&start<NOW)return"past";
  if(S.appts.some(a=>a.doc===doc.id&&a.date===date&&a.status!=="cancelled"&&start<a.start+a.dur&&start+dur>a.start))return"booked";
  return null;
}
const WHY={clinic_closed:"clinic is closed",on_leave:"is on leave",outside_hours:"is outside working hours",break:"is on a break",past:"time has passed",booked:"is already booked"};
function slotsFor(doc,date){const h=doc.hours[wd(date)];if(!h)return[];const out=[];for(let s=h[0];s+DUR<=h[1];s+=DUR)out.push(s);return out}
function freeSlots(date,docId){
  const out=[];
  (docId?[docById(docId)]:ORDER).forEach(d=>slotsFor(d,date).forEach(s=>{if(!checkSlot(d,date,s))out.push({doc:d,start:s})}));
  return out.sort((a,b)=>a.start-b.start);
}
/* doctor assignment: usual doctor first, otherwise first free doctor */
function resolveDoctor(pid,date,start){
  const trace=[],p=patient(pid);
  if(p&&p.usual){
    const u=docById(p.usual),why=checkSlot(u,date,start);
    if(!why){trace.push({ok:1,t:u.name+" is "+p.name.split(" ")[0]+"'s usual doctor and is free at "+fmt(start)});return{doc:u,how:"auto_usual",trace}}
    trace.push({no:1,t:u.name+" is the usual doctor but "+WHY[why]+" at "+fmt(start)});
  }else trace.push({go:1,t:"New patient — no usual doctor yet"});
  for(const d of ORDER){
    if(p&&d.id===p.usual)continue;
    const why=checkSlot(d,date,start);
    if(!why){trace.push({ok:1,t:d.name+" is the first free doctor at "+fmt(start)});return{doc:d,how:"auto_free",trace}}
    trace.push({no:1,t:d.name+" "+WHY[why]});
  }
  trace.push({no:1,t:"Nobody is free at "+fmt(start)});
  return{doc:null,how:null,trace};
}
function book(o){const a=Object.assign({id:"a"+S.nid++,dur:DUR,status:"confirmed"},o);S.appts.push(a);return a}
function unbook(tag){S.appts=S.appts.filter(a=>a.tag!==tag)}

/* ───────────── dashboard maths (computed from state, never hard-coded) ───────────── */
function planMoney(pl){
  if(!pl)return{sub:0,disc:0,net:0,paid:0,bal:0,billed:0};
  const sub=pl.sit.reduce((s,x)=>s+x.amt,0),disc=Math.round(sub*pl.disc/100),net=sub-disc,f=sub?net/sub:1;
  const paid=pl.sit.reduce((s,x)=>s+x.paid,0),billed=pl.sit.filter(x=>x.status==="done").reduce((s,x)=>s+Math.round(x.amt*f),0);
  return{sub,disc,net,paid,bal:net-paid,billed,f};
}
function kpis(){
  const a=apptsOn(D0).filter(x=>x.status!=="cancelled");
  const done=a.filter(x=>x.status==="completed"), left=a.length-done.length;
  const pm=planMoney(S.plan);
  const billedA=a.reduce((s,x)=>s+(x.kind==="sitting"?0:x.fee),0), paidA=done.reduce((s,x)=>s+(x.kind==="sitting"?0:x.fee),0);
  const billed=billedA+pm.billed, collected=paidA+pm.paid;
  let avail=0;DOCS.forEach(d=>{const h=d.hours[wd(D0)];if(h)avail+=(h[1]-h[0])-(d.brk[1]-d.brk[0])});
  const booked=a.reduce((s,x)=>s+x.dur,0);
  const newPts=18+S.patients.filter(p=>p.created).length;
  const outstanding=18500+pm.bal;
  const low=S.stock.filter(s=>s.q<=s.min);
  return{a,done,left,billed,collected,avail,booked,newPts,outstanding,low,pm,
    rate:pct(collected,billed),util:pct(booked,avail),ns:{c:112,n:9,rate:pct(9,121)}};
}

/* ───────────── shared UI pieces ───────────── */
const NAV=[["dash","🏠","Dashboard"],["chat","🤖","Assistant"],["cal","🗓","Calendar"],["treat","🦷","Treatments"],["wa","💬","WhatsApp"],["bld","🛠","AI Builder"]];
const GOTO={dash:"dash",chat:"chat",cal:"cal",treat:"treat",wa:"wa",bld:"bld",al:"bld"};
function shell(active,inner,url){
  const items=NAV.slice(); if(S.bld.applied)items.splice(items.length-1,0,["al","📎","Aligners"]);
  $("#url").textContent="app.mediflow.in/"+url;
  return '<div class="app"><div class="side"><div class="cl">Bright Smile Dental<small>Dental pack · Bengaluru</small></div>'+
    items.map(i=>'<button class="nav'+(i[0]===active?" on":"")+(i[0]==="al"&&S.bld.fresh?" new":"")+'" data-act="goto" data-ch="'+GOTO[i[0]]+'">'+i[1]+" "+i[2]+"</button>").join("")+
    '<span class="nav" style="opacity:.5">👥 Patients</span><span class="nav" style="opacity:.5">🧾 Billing</span><span class="nav" style="opacity:.5">📦 Stock</span></div><div class="main">'+inner+"</div></div>";
}
const first=n=>n.split(" ")[0];
function chat(msgs){
  return '<div class="chatscroll"><div class="chat">'+msgs.map(m=>'<div class="msg '+m.w+'">'+m.h+(m.chips?'<div class="chips">'+m.chips+"</div>":"")+"</div>").join("")+"</div></div>";
}
function phone(name,num,bubbles){
  return '<div class="phone"><div class="ph"><span class="av">'+name[0]+'</span><div>'+name+"<small>"+num+'</small></div></div><div class="pb">'+
    bubbles.map(b=>'<div class="wb'+(b.me?" me":"")+'">'+b.t.replace(/\*([^*]+)\*/g,"<b>$1</b>")+"<time>"+(b.time||"10:31 AM")+(b.me?" ✓✓":"")+"</time></div>").join("")+"</div></div>";
}
const trace=items=>'<ul class="trace">'+items.map(i=>'<li class="'+(i.no?"no":i.go?"go":"")+'"><i>'+(i.no?"✕":i.go?"→":"✓")+"</i><div>"+i.t+(i.s?"<small>"+i.s+"</small>":"")+"</div></li>").join("")+"</ul>";
const cb=(on,t,em)=>'<div class="cb'+(on?" on":"")+'"><i>'+(on?"✓":"")+"</i>"+t+(em?"<em>"+em+"</em>":"")+"</div>";

function waText(kind,a,extra){
  const p=patient(a.pid)||{name:"Patient"},d=docById(a.doc),when=nice(a.date)+" at "+fmt(a.start),f=first(p.name);
  const foot="\nFor any change please call +91 80 4000 1234.";
  switch(kind){
    case"confirm":return "✅ *Appointment confirmed*\n\nHi "+f+", your appointment at *Bright Smile Dental* is booked.\n\n📅 "+when+"\n👨‍⚕️ "+d.name+"\n🏥 In-clinic visit\n💰 Fee: "+inr(a.fee)+"\n📍 MG Road, Bengaluru\n\nPlease arrive 10 minutes early."+foot;
    case"remind":return "⏰ *Appointment reminder*\n\nHi "+f+", this is a reminder of your appointment at *Bright Smile Dental*.\n\n📅 "+when+"\n👨‍⚕️ "+d.name+"\n\nReply CANCEL if you cannot make it."+foot;
    case"resched":return "🔁 *Appointment rescheduled*\n\nHi "+f+", your appointment has moved.\n\n❌ Was: "+extra+"\n✅ Now: "+when+"\n👨‍⚕️ "+d.name+foot;
    case"cancel":return "❌ *Appointment cancelled*\n\nHi "+f+", your appointment on "+when+" has been cancelled.\nReason: "+(extra||"Doctor unavailable")+"\n\nReply here to book a new time."+foot;
    case"sitting":return "🦷 *Next sitting reminder*\n\nHi "+f+", sitting "+extra+" of your treatment is on\n📅 "+when+"\n👨‍⚕️ "+d.name+"\n\nPlease eat before you come. See you soon!"+foot;
    case"receipt":return "🧾 *Payment received*\n\nHi "+f+", we received "+inr(extra.paid)+" for "+extra.title+".\nBalance remaining: "+inr(extra.bal)+"\nInvoice "+extra.inv+" attached."+foot;
    case"doctor":return "📋 *New appointment*\n\n"+p.name+(p.created?" · new patient":"")+"\n📅 "+when+"\n🏥 In-clinic"+(a.reason?"\n📝 "+a.reason:"");
  }
}

/* ───────────── 1 · sign-up ───────────── */
function scrSignup(s){
  const SP=[["🦷","Dental","Chair, tooth chart, sittings",1],["🧴","Dermatology","Skin, lasers, follow-ups",0],["🦴","Orthopaedics","Fractures, physio, implants",0],["🩺","General practice","OPD, vitals, prescriptions",0],["✨","Build your own","Describe it, AI builds it",0]];
  if(s>=3){
    const L=[["Patients & tooth chart","FDI notation, allergy alerts, history"],["Appointments & calendar","Doctor schedules, leave, auto-assign"],["Multi-sitting treatment plans","Per-sitting amount, date and payment"],["Billing & invoices","Printable, part-payments, discounts"],["Stock that deducts itself","Consumables used per procedure"],["WhatsApp templates","Confirmation, reminder, reschedule, cancel"],["Dental price list","Editable procedure fees"]];
    return '<div class="main"><div style="max-width:560px;margin:10px auto"><h3 class="pg">Dental pack installed ✓</h3><p class="sub">Everything below is already set up in your clinic. All of it can be changed later by chatting with the AI Builder.</p><div class="card">'+
      L.map(x=>cb(1,"<b>"+x[0]+"</b>",x[1])).join("")+'</div><p class="note" style="margin-top:12px">Other packs (dermatology, orthopaedics, general practice…) install the same way, each with its own objects, fields and templates.</p></div></div>';
  }
  const dots=[0,1,2].map(i=>'<span class="tag '+(i===s?"acc":i<s?"ok":"")+'">'+(i+1)+" · "+["Clinic","Specialty","Account"][i]+"</span>").join(" ");
  let body="";
  if(s===0)body='<div class="form"><div class="row"><div><label class="lb">Clinic name</label><div class="inp fill">Bright Smile Dental</div></div><div><label class="lb">Brand name (shown to patients)</label><div class="inp fill">Bright Smile</div></div></div><div class="row"><div><label class="lb">City</label><div class="inp fill">Bengaluru</div></div><div><label class="lb">Clinic phone</label><div class="inp fill">+91 80 4000 1234</div></div></div></div>';
  if(s===1)body='<p class="note" style="margin-bottom:10px">Pick the pack that matches your practice. It decides which tables, fields and templates are pre-built.</p><div class="specs">'+SP.map(x=>'<div class="spec'+(x[3]?" on":"")+'"><div class="e">'+x[0]+"</div><b>"+x[1]+"</b><small>"+x[2]+"</small></div>").join("")+"</div>";
  if(s===2)body='<div class="form"><div class="row"><div><label class="lb">Your name</label><div class="inp fill">Dr. Priya Sharma</div></div><div><label class="lb">Work email</label><div class="inp fill">priya@brightsmile.in</div></div></div><div class="row"><div><label class="lb">Password</label><div class="inp fill">••••••••••</div></div><div><label class="lb">Confirm password</label><div class="inp fill">••••••••••</div></div></div></div><div class="callout" style="margin-top:6px">📧 After launch we email a confirmation link to <b>priya@brightsmile.in</b>. Click it, then sign in.</div>';
  return '<div class="main"><div style="max-width:640px;margin:10px auto"><h3 class="pg">Create your clinic</h3><p class="sub">Takes about a minute. No credit card.</p><div style="margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap">'+dots+'</div><div class="card">'+body+'<div style="display:flex;justify-content:flex-end;margin-top:12px"><span class="btn primary">'+(s===2?"Launch my clinic 🚀":"Continue →")+"</span></div></div></div></div>";
}

/* ───────────── 2 / 8 · dashboard ───────────── */
function delta(cur,old,f){const d=cur-old;if(!d)return"";return' <span class="'+(d>0?"up":"dn")+'">'+(d>0?"▲ +":"▼ ")+(f?f(Math.abs(d)):Math.abs(d))+" since this morning</span>"}
function scrDash(hl,cmp){
  const k=kpis(),b=BASE;
  const tile=(key,l,v,d,f)=>'<div class="card kpi'+(hl===key?" hl":"")+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d">'+d+"</div>"+(hl===key?'<div class="f">'+f+"</div>":"")+"</div>";
  const days=[];let dd=D0;for(let i=0;i<4;i++){dd=addD(dd,-1);if(wd(dd)===0)dd=addD(dd,-1);days.unshift(dd)}
  const vals=[21400,18900,26100,15300],mx=Math.max(k.collected,...vals,1000);
  const bars=days.map((x,i)=>'<div class="b"><em>'+(vals[i]/1000).toFixed(1)+'k</em><i style="height:'+Math.round(vals[i]/mx*92)+'px"></i>'+DN[wd(x)]+"</div>").join("")+
    '<div class="b today"><em>'+(k.collected/1000).toFixed(1)+'k</em><i style="height:'+Math.max(3,Math.round(k.collected/mx*92))+'px"></i>Today</div>';
  const perDoc=DOCS.map(d=>{const n=k.a.filter(x=>x.doc===d.id);return"<tr><td>"+d.name+"</td><td class='mono'>"+n.length+"</td><td class='mono'>"+(n.length*DUR/60).toFixed(1)+" h</td><td class='mono'>"+inr(n.reduce((s,x)=>s+(x.kind==="sitting"?0:x.fee),0))+"</td></tr>"}).join("");
  const nm=k.low.map(x=>x.n+" ("+x.q+" "+x.u+")").join(", ")||"All stocked";
  return '<h3 class="pg">Good morning, Dr. Sharma</h3><p class="sub">'+nice(D0)+" · clinic clock 10:30 AM"+(cmp?" · compared with this morning":"")+'</p>'+
  '<div class="grid g4">'+
   tile("appts","Appointments today",k.a.length,k.done.length+" done · "+k.left+" to come"+(cmp?delta(k.a.length,b.a.length):""),k.done.length+" completed + "+k.left+" confirmed = <b>"+k.a.length+"</b> <span class='note'>(cancelled ones are not counted)</span>")+
   tile("rev","Collected today",inr(k.collected),"of "+inr(k.billed)+" billed · "+k.rate+"%"+(cmp?delta(k.collected,b.collected,inr):""),"Collected <b>"+inr(k.collected)+"</b> ÷ Billed <b>"+inr(k.billed)+"</b> = <b>"+k.rate+"%</b> collection rate")+
   tile("util","Chair utilisation",k.util+"%",(k.booked/60).toFixed(1)+" h booked of "+(k.avail/60)+" h"+(cmp?delta(k.util,b.util,x=>x.toFixed(1)+"%"):""),"<b>"+k.booked+"</b> booked min ÷ <b>"+k.avail+"</b> available min (working hours minus breaks, both doctors) = <b>"+k.util+"%</b>")+
   tile("ns","No-show rate",k.ns.rate+"%","last 30 days","<b>"+k.ns.n+"</b> no-shows ÷ (<b>"+k.ns.c+"</b> completed + <b>"+k.ns.n+"</b> no-shows) = <b>"+k.ns.rate+"%</b>")+
  '</div><div class="grid g3" style="margin-top:12px">'+
   tile("newp","New patients this month",k.newPts,"auto-created from bookings"+(cmp?delta(k.newPts,b.newPts):""),"")+
   tile("out","Outstanding balances",inr(k.outstanding),"unpaid treatment plans & invoices"+(cmp?delta(k.outstanding,b.outstanding,inr):""),"₹18,500 older dues + treatment-plan balances <b>"+inr(k.pm.bal)+"</b> = <b>"+inr(k.outstanding)+"</b>")+
   tile("stock","Low stock",k.low.length,nm.length>46?nm.slice(0,44)+"…":nm,"")+
  '</div><div class="grid g2" style="margin-top:12px"><div class="card'+(hl==="chart"?" hl":"")+'"><b>Collections, last 5 working days</b><div class="bars">'+bars+'</div></div><div class="card"><b>Today by doctor</b><div class="scroll"><table class="t"><tr><th>Doctor</th><th>Visits</th><th>Chair time</th><th>Billed</th></tr>'+perDoc+"</table></div></div></div>";
}

/* ───────────── 3 · AI builder ───────────── */
function scrBuilder(s){
  const recs=UI.recs;
  const um=t=>({w:"u",h:t}),am=(t,c)=>({w:"a",h:t,chips:c});
  const m=[am("Hi! Tell me what you want to track or change. I plan it, show you a preview, and only apply it after you approve.")];
  if(s>=1)m.push(um("We run an aligner clinic. I need to track each patient's aligner trays: which tray number, upper or lower, when they started wearing it and when to change it."));
  if(s>=1)m.push(am("Got it. I'll create an <b>Aligner Tray</b> object linked to Patient and put it in a new <b>Aligners</b> app. I've recommended the fields below. Untick any you don't want; you can always add more later."));
  if(s>=3)m.push(am("✅ Applied. <b>Aligners</b> is now in your menu with a real table behind it. Changeset <code>cs_0412</code> is saved so you can undo it."));
  if(s>=4)m.push(um("Add a “Refinement needed” checkbox and hide Notes."));
  if(s>=4)m.push(am("✅ Done: 1 field added, 1 hidden. The data already in Notes is kept."));
  if(s>=5)m.push(um("Show me trays due for change this week, by doctor."));
  if(s>=5)m.push(am("I built a report and pinned it to a new <b>Aligners</b> dashboard (right)."));
  if(s>=6)m.push(um("Receptionists can view trays but not edit. Doctors should only see their own patients' trays."));
  if(s>=6)m.push(am("Drafted a profile, a permission set and a record-level rule. Review them on the right."));

/* ───────────── voice (browser text-to-speech) ───────────── */
const TTS=typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined";
let voiceOn=false,voice=null,tok=0,speaking=false;
function pickVoice(){if(!TTS)return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang)&&/female|zira|samantha|aria|jenny|google uk english female/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim()};
function cancelSpeech(){tok++;speaking=false;if(TTS)try{speechSynthesis.cancel()}catch(e){}}
function speak(text,done){
  cancelSpeech();const my=tok;speaking=true;
  const parts=(text.match(/[^.!?:]+[.!?:]*/g)||[text]).map(x=>x.trim()).filter(Boolean);let i=0,fin=false;
  const finish=()=>{if(fin||my!==tok)return;fin=true;speaking=false;if(done)done()};
  const safety=setTimeout(finish,4000+text.length*90);
  const nextPart=()=>{
    if(my!==tok)return;
    if(i>=parts.length){clearTimeout(safety);finish();return}
    const u=new SpeechSynthesisUtterance(parts[i++]);if(voice){u.voice=voice;u.lang=voice.lang}else u.lang="en-IN";
    u.rate=1;u.pitch=1;u.onend=nextPart;u.onerror=nextPart;
    try{speechSynthesis.speak(u)}catch(e){clearTimeout(safety);finish()}
  };
  nextPart();
}
function narrate(){
  if(!voiceOn||!TTS)return;
  const st=CH[pos.c].steps[pos.s];
  speak(st.t+". "+plain(st.say),()=>{if(playing){clearTimeout(timer);timer=setTimeout(next,1100)}});
}
function setVoice(on){voiceOn=on&&TTS;if(!voiceOn)cancelSpeech();const b=$("#voiceBtn");if(b)b.textContent=voiceOn?"🔊 Voice on":"🔇 Voice off";render()}

/* ───────────── controller ───────────── */
const pos={c:0,s:0};let timer=null,playing=false;
const total=CH.reduce((n,c)=>n+c.steps.length,0);
const flat=()=>{let n=0;for(let i=0;i<pos.c;i++)n+=CH[i].steps.length;return n+pos.s};
function applyStep(){CH[pos.c].steps[pos.s].apply()}
function renderScreen(){const c=CH[pos.c];$("#screen").innerHTML=c.screen(pos.s);document.querySelectorAll(".chatscroll").forEach(e=>{e.scrollTop=e.scrollHeight})}
function render(){
  const c=CH[pos.c],st=c.steps[pos.s];
  $("#chapters").innerHTML=CH.map((x,i)=>'<button class="chap'+(i===pos.c?" on":i<pos.c?" done":"")+'" data-act="chap" data-v="'+i+'"><span class="n">'+(i<pos.c?"✓":i+1)+"</span>"+x.title+"</button>").join("");
  $("#say").innerHTML='<div class="aria"><span class="av">✦</span><div><b>Aria</b> <span>· chapter '+(pos.c+1)+" of "+CH.length+" · step "+(pos.s+1)+"/"+c.steps.length+'</span></div></div><h2>'+st.t+'</h2><div class="txt">'+st.say+"</div>";
  const how=$("#how");how.hidden=!st.how;how.innerHTML=st.how?"<b>Under the hood</b>"+st.how:"";
  $("#prog").style.width=Math.round((flat()+1)/total*100)+"%";
  $("#bBack").disabled=flat()===0;
  const last=flat()===total-1;$("#bNext").textContent=last?"Done ✓":"Next →";$("#bNext").disabled=last;
  $("#bPlay").textContent=playing?"⏸ Pause":"▶ Auto";
  if(voiceOn)$("#say .aria b").insertAdjacentHTML("afterend",'<span class="speaking" aria-hidden="true"><i></i><i></i><i></i></span>');
  renderScreen();
  const act=document.querySelector(".chap.on");if(act&&act.scrollIntoView&&window.innerWidth<=980)act.scrollIntoView({block:"nearest",inline:"center"});
}
function go(c,s){pos.c=c;pos.s=s;applyStep();render();if(voiceOn){clearTimeout(timer);narrate()}else schedule()}
function next(){const c=CH[pos.c];if(pos.s<c.steps.length-1)go(pos.c,pos.s+1);else if(pos.c<CH.length-1)go(pos.c+1,0);else stop()}
function back(){if(pos.s>0)go(pos.c,pos.s-1);else if(pos.c>0)go(pos.c-1,CH[pos.c-1].steps.length-1)}
function stop(){playing=false;clearTimeout(timer);$("#bPlay").textContent="▶ Auto"}
function startPlay(){playing=true;$("#bPlay").textContent="⏸ Pause";if(flat()>=total-1){go(0,0)}else if(voiceOn){if(!speaking)narrate()}else schedule()}
function schedule(){clearTimeout(timer);if(!playing)return;if(flat()>=total-1){stop();return}const len=(CH[pos.c].steps[pos.s].say||"").length;timer=setTimeout(next,Math.min(14000,5500+len*28))}
function jumpChapter(id){const i=CH.findIndex(c=>c.id===id);if(i>=0)go(i,0)}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case"next":stop();next();break;
    case"back":stop();back();break;
    case"play":if(playing){stop()}else{startPlay()}break;
    case"voice":setVoice(!voiceOn);if(voiceOn)narrate();break;
    case"startvoice":$("#intro").hidden=true;setVoice(true);go(0,0);startPlay();break;
    case"startquiet":$("#intro").hidden=true;go(0,0);break;
    case"restart":stop();go(0,0);break;
    case"chap":stop();go(+v,0);break;
    case"goto":stop();jumpChapter(el.dataset.ch);break;
    case"theme":{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";break}
    case"pick":stop();UI.pick=+v;if(pos.c===3&&pos.s<3){go(3,3)}else{applyStep();render()}break;
    case"day":UI.day=v;renderScreen();break;
    case"leave":{const k=v+"|"+UI.day;S.leaves.has(k)?S.leaves.delete(k):S.leaves.add(k);renderScreen();break}
    case"bookit":{unbook("asg");const r=resolveDoctor(UI.asg.pid,UI.asg.date,UI.asg.time);if(r.doc){book({date:UI.asg.date,start:UI.asg.time,doc:r.doc.id,pid:UI.asg.pid,reason:"Check-up",fee:FEE[r.doc.id],tag:"asg"});UI.day=UI.asg.date}renderScreen();break}
    case"mkplan":createPlan(v,0);renderScreen();break;
    case"complete":completeSit(+v);renderScreen();break;
    case"pay":paySit(+v);renderScreen();break;
    case"disc":S.plan.disc=+v;renderScreen();break;
    case"wak":UI.wa.kind=v;renderScreen();break;
    case"wam":UI.wa.mode=v;renderScreen();break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-bind]");if(!el)return;
  const k=el.dataset.bind;UI.asg[k]=(k==="time")?+el.value:el.value;unbook("asg");renderScreen();
});
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"){stop();next()}else if(e.key==="ArrowLeft"){stop();back()}
});

seed();BASE=kpis();
if(!TTS){$("#voiceBtn").hidden=true;$("#introVoice").hidden=true;$("#introTxt").textContent="This browser cannot speak, so Aria's narration is shown as text. Use Next, or Auto to advance by itself."}
go(0,0);
})();

</script>
</body></html>
